<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>

    <!-- Left Pillar Gradient (Cyan to Indigo) -->
    <linearGradient id="leftPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Diagonal Slash Gradient (Indigo to Violet to Fuchsia) -->
    <linearGradient id="diagSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Right Pillar Gradient (Violet to Pink) -->
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Accent Diamond Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows / Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#centerGlow)" />
  
  <!-- Subtle Inner Grid / Tech Pattern Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="16" y1="176" x2="496" y2="176" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="336" x2="496" y2="336" />
    <line x1="176" y1="16" x2="176" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="336" y1="16" x2="336" y2="496" />
  </g>

  <!-- Glowing Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Monogram Logo Artwork (N & xF Concept) -->
  <g filter="url(#softShadow)">
    <!-- Left Vertical Pillar -->
    <path d="M 144 152 C 144 138.7 154.7 128 168 128 L 188 128 C 201.3 128 212 138.7 212 152 L 212 360 C 212 373.3 201.3 384 188 384 L 168 384 C 154.7 384 144 373.3 144 360 Z" 
          fill="url(#leftPillar)" />

    <!-- Right Vertical Pillar -->
    <path d="M 300 152 C 300 138.7 310.7 128 324 128 L 344 128 C 357.3 128 368 138.7 368 152 L 368 360 C 368 373.3 357.3 384 344 384 L 324 384 C 310.7 384 300 373.3 300 360 Z" 
          fill="url(#rightPillar)" />

    <!-- Dynamic Diagonal Ribbon (Overlapping N Crossbar) -->
    <path d="M 152 136 L 214 136 L 360 368 L 298 368 Z" 
          fill="url(#diagSlash)" 
          filter="url(#glowFilter)" />

    <!-- Isometric Highlight Accent on Diagonal -->
    <path d="M 154 138 L 180 138 L 326 370 L 300 370 Z" 
          fill="#ffffff" 
          opacity="0.25" />

    <!-- Tech Diamond Star Sparkle (Top-Right Innovation Accent) -->
    <g transform="translate(372, 108)">
      <path d="M 0 -22 C 0 -10 10 0 22 0 C 10 0 0 10 0 22 C 0 10 -10 0 -22 0 C -10 0 0 -10 0 -22 Z" 
            fill="url(#sparkGrad)" 
            filter="url(#glowFilter)" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Bottom Left Tech Vertex Accent -->
    <circle cx="178" cy="384" r="5" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>